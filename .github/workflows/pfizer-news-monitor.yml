name: Pfizer News Monitor

on:
  schedule:
    # Run every 5 minutes during the UTC hours that map to Beijing 09:00, 12:00, and 17:00.
    # The script itself ensures each Beijing slot is processed only once.
    - cron: "*/5 1,4,9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan monitored news pages
        env:
          FORCE_SCAN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python scripts/pfizer_news_monitor.py

      - name: Upload Word document
        uses: actions/upload-artifact@v4
        with:
          name: news-monitor-report
          path: reports/*.docx
          if-no-files-found: ignore

      - name: Commit monitor state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${GITHUB_REF_NAME}"
          git add .state/pfizer_news_seen.json
          git diff --cached --quiet || git commit -m "Update Pfizer news monitor state"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
