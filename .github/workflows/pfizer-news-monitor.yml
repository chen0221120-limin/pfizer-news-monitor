name: Pfizer News Monitor

on:
  schedule:
    # Beijing time: weekdays 09:07, 12:07, 17:07.
    - cron: "7 1,4,9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan Pfizer newsroom
        run: python scripts/pfizer_news_monitor.py

      - name: Upload Word document
        uses: actions/upload-artifact@v4
        with:
          name: pfizer-news-report
          path: reports/*.docx
          if-no-files-found: ignore

      - name: Commit monitor state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .state/pfizer_news_seen.json
          git diff --cached --quiet || git commit -m "Update Pfizer news monitor state"
          git push
