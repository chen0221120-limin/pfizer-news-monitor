name: Pfizer News Monitor

on:
  schedule:
    # Run every 5 minutes only inside the UTC hours that map to the
    # Beijing 09/12/17 scan windows and their 2-hour catch-up windows.
    # 09:00-10:59 CST -> 01:00-02:59 UTC
    # 12:00-13:59 CST -> 04:00-05:59 UTC
    # 17:00-18:59 CST -> 09:00-10:59 UTC
    - cron: "*/5 1,2,4,5,9,10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan monitored news pages
        env:
          FORCE_SCAN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python scripts/pfizer_news_monitor.py

      - name: Upload Word document
        uses: actions/upload-artifact@v4
        with:
          name: news-monitor-report
          path: reports/*.docx
          if-no-files-found: ignore

      - name: Commit monitor state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${GITHUB_REF_NAME}"
          git add .state/pfizer_news_seen.json
          git diff --cached --quiet || git commit -m "Update Pfizer news monitor state"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
